<!doctype html>
<html>
  <head>
    <title>Xscrapper Gallery</title>

    <style>
      :root {
        --bg-main: #f8fafc;
        --border-color: #e2e8f0;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --color-pending: #f59e0b;
        --color-done: #22c55e;
        --color-blue: #3b82f6;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-dark);
        padding: 24px;
        margin: 0;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 24px;
        color: var(--text-dark);
      }

      /* Stats Dashboard Grid */
      .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat-card {
        background: white;
        padding: 20px;
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
        border-color: #cbd5e1;
      }

      .stat-card:active {
        transform: translateY(0);
      }

      /* Subtle status indicators */
      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: transparent;
        transition: height 0.2s ease;
      }
      .stat-card.pending::before {
        background: var(--color-pending);
      }
      .stat-card.done::before {
        background: var(--color-done);
      }
      .stat-card.today::before {
        background: var(--color-blue);
      }

      /* Active tab styling with custom tint backgrounds */
      .stat-card.active {
        border-color: var(--text-dark);
        background: #f8fafc;
      }
      .stat-card.active::before {
        height: 6px;
      }
      .stat-card.active.pending {
        border-color: var(--color-pending);
        background: rgba(245, 158, 11, 0.04);
      }
      .stat-card.active.done {
        border-color: var(--color-done);
        background: rgba(34, 197, 94, 0.04);
      }
      .stat-card.active.today {
        border-color: var(--color-blue);
        background: rgba(59, 130, 246, 0.04);
      }

      .stat-number {
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 6px;
      }
      #stat-pending {
        color: var(--color-pending);
      }
      #stat-done {
        color: var(--color-done);
      }
      #stat-today {
        color: var(--color-blue);
      }

      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        tracking-letter: 0.05em;
      }

      /* Filters & Controls Row */
      .controls-container {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        align-items: center;
      }

      .search-wrapper {
        flex-grow: 1;
        max-width: 480px; /* Prevents input from stretching awkwardly wide */
        position: relative;
      }

      #search {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 14px 10px 38px;
        border: 1px solid var(--border-color);
        font-size: 14px;
        background: white;
        transition: border-color 0.15s ease;
      }

      /* Muted Magnifying Glass Icon built with Pure CSS */
      .search-wrapper::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 6px;
        height: 6px;
        border: 2px solid var(--text-muted);
        border-radius: 50%;
      }
      .search-wrapper::after {
        content: "";
        position: absolute;
        left: 21px;
        top: 58%;
        width: 5px;
        height: 2px;
        background: var(--text-muted);
        transform: rotate(45deg);
      }

      #search:focus,
      #sort-filter:focus {
        outline: none;
        border-color: var(--color-blue);
      }

      #sort-filter {
        padding: 10px 14px;
        border: 1px solid var(--border-color);
        background: white;
        font-size: 14px;
        color: var(--text-dark);
        cursor: pointer;
        height: 38px;
      }

      /* Compact Grid Layout */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      /* Small Card Styling */
      .card {
        background: white;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-color);
      }
      .card:hover {
        border: 1px solid black;
      }

      .thumb-container {
        width: 100%;
        aspect-ratio: 3 / 4;
        background: #000;
        overflow: hidden;
        position: relative;
      }

      .thumb-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .card-content {
        padding: 8px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .time {
        font-size: 9px;
        color: var(--text-muted);
        font-weight: 500;
        margin-bottom: 4px;
      }

      .tweet-text {
        font-size: 11px;
        line-height: 1.4;
        color: var(--text-dark);
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 30px;
      }

      .card-actions {
        display: flex;
        margin-top: auto;
      }

      .btn {
        border: 1px solid var(--border-color);
        background-color: white;
        text-decoration: none;
        color: var(--text-dark);
        text-align: center;
        padding: 6px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        width: 100%;
        transition: background 0.1s;
      }
      .btn:hover {
        background: var(--bg-main);
      }

      .small-btn svg,
      .small-btn path {
        pointer-events: none;
      }

      .small-btn {
        border: 1px solid var(--border-color);
        text-decoration: none;
        color: var(--text-dark);
        text-align: center;
        padding: 4px 8px;
        display: inline-block;
        margin-right: 4px;
        background-color: white;
      }

      .small-btn svg {
        width: 1em;
        height: 1em;
      }

      .card .popup:is(:focus-within, :hover) {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Collected Videos</h2>

      <div class="stats-container">
        <div class="stat-card active" data-filter="all">
          <div id="stat-total" class="stat-number">0</div>
          <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-card pending" data-filter="pending">
          <div id="stat-pending" class="stat-number">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card done" data-filter="done">
          <div id="stat-done" class="stat-number">0</div>
          <div class="stat-label">Done</div>
        </div>
        <div class="stat-card today" data-filter="today">
          <div id="stat-today" class="stat-number">0</div>
          <div class="stat-label">Saved Today</div>
        </div>
      </div>

      <div class="controls-container">
        <div class="search-wrapper">
          <input type="search" id="search" placeholder="Search saved videos..." />
        </div>
        <select id="sort-filter">
          <option value="collected-newest">Collected: Newest First</option>
          <option value="collected-oldest">Collected: Oldest First</option>
          <option value="posted-newest">Posted: Newest First</option>
          <option value="posted-oldest">Posted: Oldest First</option>
        </select>
      </div>

      <div id="grid" class="grid"></div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
