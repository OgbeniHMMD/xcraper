<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Xscrapper Gallery</title>
    <link href="tailwind.css" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 m-0 p-4 h-screen overflow-hidden flex flex-col text-slate-900">
    <div class="mx-auto max-w-400 w-full flex flex-col h-full overflow-hidden">
      <div class="flex flex-wrap items-center gap-3 mb-3 shrink-0">
        <h2 class="mr-auto font-bold text-slate-900 text-xl">Collected Videos</h2>

        <div class="relative w-64 max-w-full">
          <!-- Inline SVG Search Icon -->
          <svg class="top-1/2 left-3 absolute w-4 h-4 text-slate-400 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.637 10.637Z" />
          </svg>
          <input
            type="search"
            id="search"
            placeholder="Search saved videos..."
            class="box-border bg-white pl-10 pr-3.5 border border-slate-200 focus:border-blue-500 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 w-full h-9 text-slate-900 text-sm"
          />
        </div>

        <select
          id="sort-filter"
          class="bg-white px-3 border border-slate-200 focus:border-blue-500 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 h-9 text-slate-900 text-sm cursor-pointer"
        >
          <option value="collected-newest">Collected: Newest First</option>
          <option value="collected-oldest">Collected: Oldest First</option>
          <option value="posted-newest">Posted: Newest First</option>
          <option value="posted-oldest">Posted: Oldest First</option>
        </select>

        <div class="inline-flex divide-x divide-slate-200 bg-white border border-slate-200 rounded-md overflow-hidden">
          <button id="auto-scroll" class="hover:bg-slate-50 px-3 h-9 text-slate-900 text-sm cursor-pointer" title="Auto-scroll to cache thumbnails" aria-label="Toggle auto-scroll">
            <span id="scroll-icon">▶</span>
          </button>
          <button id="jump-to-top" title="Jump to top" aria-label="Jump to top" class="hover:bg-slate-50 px-3 h-9 text-slate-900 text-sm cursor-pointer">⬆</button>
          <button id="jump-to-bottom" title="Jump to bottom" aria-label="Jump to bottom" class="hover:bg-slate-50 px-3 h-9 text-slate-900 text-sm cursor-pointer">⬇</button>
        </div>

        <button
          id="mark-all-btn"
          class="flex items-center gap-2 bg-white hover:bg-slate-50 px-3 h-9 border border-slate-200 rounded-md text-slate-900 text-sm cursor-pointer"
          title="Mark/Unmark All currently visible items"
        >
          <span>☑</span>
          <span id="mark-all-text">Mark All</span>
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2 mb-3 shrink-0">
        <button type="button" class="filter-chip active" data-filter="all" aria-pressed="true">
          <span>All</span>
          <span id="stat-total" class="chip-count">0</span>
        </button>
        <button type="button" class="filter-chip pending" data-filter="pending" aria-pressed="false">
          <span class="chip-dot"></span>
          <span>Pending</span>
          <span id="stat-pending" class="chip-count">0</span>
        </button>
        <button type="button" class="filter-chip done" data-filter="done" aria-pressed="false">
          <span class="chip-dot"></span>
          <span>Done</span>
          <span id="stat-done" class="chip-count">0</span>
        </button>
        <button type="button" class="filter-chip today" data-filter="today" aria-pressed="false">
          <span class="chip-dot"></span>
          <span>Today</span>
          <span id="stat-today" class="chip-count">0</span>
        </button>
        <button type="button" class="filter-chip flagged" data-filter="flagged" aria-pressed="false">
          <span class="chip-dot"></span>
          <span>Flagged</span>
          <span id="stat-flagged" class="chip-count">0</span>
        </button>
        <button type="button" class="filter-chip broken" data-filter="broken" aria-pressed="false">
          <span class="chip-dot"></span>
          <span>Broken</span>
          <span id="stat-broken" class="chip-count">0</span>
        </button>
      </div>

      <div id="scroll-container" class="overflow-y-auto grow">
        <div id="grid" class="gap-4 grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))]"></div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
