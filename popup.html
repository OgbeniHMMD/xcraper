<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        padding: 15px;
        font-family: sans-serif;
        background: #f9f9f9;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        color: #14171a;
      }
      button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        color: white;
      }
      /* Scraping controls sit side by side as a compact icon row */
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .icon-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 0;
      }
      .icon {
        width: 22px;
        height: 22px;
        display: none;
      }
      #startBtn[data-state="idle"] {
        background: #1da1f2;
      }
      #startBtn[data-state="scraping"] {
        background: #e0245e;
      }
      #startBtn[data-state="blocked"] {
        background: #9aa5ad;
        cursor: not-allowed;
      }
      #startBtn[data-state="idle"] .icon-play,
      #startBtn[data-state="scraping"] .icon-stop,
      #startBtn[data-state="blocked"] .icon-blocked {
        display: block;
      }
      #stopAllBtn {
        background: #e0245e;
      }
      #stopAllBtn .icon {
        display: block;
      }
      #viewGalleryBtn,
      #exportBtn {
        width: 100%;
      }
      #viewGalleryBtn {
        background: #673ab7;
        margin-bottom: 10px;
      }
      #exportBtn {
        background: #17bf63;
      }
    </style>
  </head>

  <body>
    <h3>Xcrapper</h3>

    <div class="controls">
      <button id="startBtn" class="icon-btn" data-state="idle" title="Start scraping on this tab">
        <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
        <svg class="icon icon-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
        <svg class="icon icon-blocked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <button id="stopAllBtn" class="icon-btn" title="Stop scraping on all tabs">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="11" height="11" rx="1.5" opacity="0.55" />
          <rect x="10" y="10" width="11" height="11" rx="1.5" />
        </svg>
      </button>
    </div>

    <button id="viewGalleryBtn" title="View saved gallery"><span id="count">0</span> Videos Saved</button>

    <button id="exportBtn">Download CSV</button>

    <script src="lib/csv.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
