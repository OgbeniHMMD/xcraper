<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 220px;
        padding: 15px;
        font-family: sans-serif;
        background: #f9f9f9;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        color: #14171a;
      }
      button {
        width: 100%;
        margin-bottom: 8px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        color: white;
      }
      #startBtn {
        background: #1da1f2;
      }
      #exportBtn {
        background: #17bf63;
      }
      #clearBtn {
        background: #e0245e;
        font-size: 11px;
      }
    </style>
  </head>

  <body>
    <h3>X Deep Collector</h3>
    <button id="startBtn">Start Scraping</button>

    <div style="background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center"><span id="count">0</span> Videos Saved</div>

    <div id="deletedContainer" style="background: #fee; padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center; display: none"><span id="deletedCount">0</span> Deleted Items</div>

    <button id="viewGalleryBtn" style="background: #673ab7; margin-top: 10px">View Saved Gallery</button>
    <button id="exportBtn">Download CSV</button>
    <button id="clearBtn">Clear Saved Data</button>
    <script src="popup.js"></script>
  </body>
</html>
